appId: com.storeco.storemanager
productName: Store Manager
copyright: Copyright © StoreCo
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # SQLite C sources are only needed to compile from source; the prebuilt binary is used.
  - "!**/node_modules/better-sqlite3/{deps,src}/**"
# Native SQLite binding must live outside the asar archive.
asarUnpack:
  - "**/*.node"
# better-sqlite3 ships Node-API prebuilds (ABI-stable across Node and Electron): nothing to compile.
npmRebuild: false
executableName: StoreManager
linux:
  files:
    - "!**/node_modules/better-sqlite3/prebuilds/{darwin,win32,linuxmusl}-*.node"
win:
  files:
    # Ship only the Windows SQLite binaries.
    - "!**/node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*.node"
  target:
    - target: nsis
      arch: [x64]
  artifactName: StoreManager-Setup-${version}.${ext}
  # Code signing: set CSC_LINK / CSC_KEY_PASSWORD in the build environment.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Store Manager
  # Business data lives in %LOCALAPPDATA%\StoreCo\StoreManager and is never removed by the uninstaller.
  deleteAppDataOnUninstall: false
